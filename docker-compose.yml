# Local stack: Postgres 16, Redis 7, API, worker, web.
#   cp .env.example .env && docker compose up --build
#   docker compose exec api npx prisma migrate deploy && docker compose exec api npx prisma db seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: higherstudy
      POSTGRES_PASSWORD: higherstudy
      POSTGRES_DB: higherstudy
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U higherstudy']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redisdata:/data]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://higherstudy:higherstudy@postgres:5432/higherstudy
      REDIS_URL: redis://redis:6379
      PROXY_SECRET: ${PROXY_SECRET:-local-proxy-secret-change-me}
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://higherstudy:higherstudy@postgres:5432/higherstudy
      REDIS_URL: redis://redis:6379
    depends_on: [api]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
      PROXY_SECRET: ${PROXY_SECRET:-local-proxy-secret-change-me}
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
